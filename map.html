<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта мёда - ВКладовке</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #FFF8E7; }
        .header { background: #8B5A2B; color: white; padding: 15px; text-align: center; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .back-btn { color: white; text-decoration: none; font-size: 1.2em; padding: 5px 10px; }
        h1 { margin: 0; font-size: 1.2em; flex-grow: 1; text-align: center; padding-right: 50px; }
        #map { height: 100vh; width: 100%; padding-top: 60px; box-sizing: border-box; }
        
        /* Стили для попапа */
        .honey-popup {
            text-align: center;
            min-width: 200px;
        }
        .honey-popup h3 {
            color: #8B5A2B;
            margin: 0 0 10px 0;
            font-size: 1.3em;
        }
        .honey-popup .honey-desc {
            color: #4A3728;
            margin: 10px 0;
            font-size: 0.95em;
        }
        .honey-popup .honey-price {
            color: #E6A419;
            font-weight: bold;
            font-size: 1.1em;
            margin: 10px 0;
        }
        .seller-btn {
            display: inline-block;
            background: linear-gradient(135deg, #F5C542 0%, #E6A419 100%);
            color: #4A3728;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(230, 164, 25, 0.4);
            transition: transform 0.1s;
        }
        .seller-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">← Назад</a>
        <h1>Навигатор мёда</h1>
    </div>
    <div id="map"></div>

    <script>
        // Точные координаты: Тюмень, ул. Стартовая, 7
        var honeySpot = [57.1454, 65.6556];
        
        // Создаём карту
        var map = L.map('map', {
            zoomControl: false
        }).setView(honeySpot, 16);
        
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);
        
        // Подключаем карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© ВКладовке | © OpenStreetMap'
        }).addTo(map);

        // Красивая иконка мёда
        var honeyIcon = L.divIcon({
            className: 'honey-marker',
            html: '<div style="font-size: 45px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));">🍯</div>',
            iconSize: [45, 45],
            iconAnchor: [22, 45]
        });

        // Маркер с информацией о мёде и кнопкой карточки продавца
        L.marker(honeySpot, {icon: honeyIcon}).addTo(map)
            .bindPopup(`
                <div class="honey-popup">
                    <h3>Мёд Липовый</h3>
                    <p class="honey-desc">Светлый, ароматный, идеален для чая. Собран в экологически чистом районе Тюменской области.</p>
                    <p class="honey-price">500 ₽ / 0.5л</p>
                    <a href="seller.html" class="seller-btn">👤 Карточка продавца</a>
                </div>
            `);
    </script>
</body>
</html>
